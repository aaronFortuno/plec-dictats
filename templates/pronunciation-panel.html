<section id="catalog-pronunciations-view" class="catalog-view" aria-label="Pronunciacions i revisió" hidden>
<div class="catalog-review-help"><button type="button" id="review-help-open" class="small-link">Com revisem les pronunciacions? <span data-icon="circle-question-mark"></span></button></div>
<section class="review-toolbar" aria-label="Cerca i revisió"><div class="review-filters"><label>Cerca un mot<input id="pronunciation-search" type="search" placeholder="Per exemple, atapeït" autocomplete="off"></label><label>Mostra<select id="review-filter"><option value="all">Tots els mots</option><option value="central-pending">Àudios d’Alba pendents</option><option value="valencia-pending">Àudios d’Enric pendents</option><option value="errors">Amb alguna incidència</option><option value="good">Amb algun àudio correcte</option><option value="ipa">Amb IPA disponible</option></select></label><label>Català central<select id="central-recording"><option value="">Carregant…</option></select></label><label>Valencià<select id="valencia-recording"><option value="">Carregant…</option></select></label></div>
<nav id="pronunciation-initials" aria-label="Inicial del mot"></nav><div class="review-counts"><span id="pronunciation-count" role="status"></span><span id="review-progress" role="status" aria-live="polite"></span></div></section>
<p id="review-notice" class="review-notice" role="status">Carregant les taules…</p><p id="review-storage-warning" class="review-notice" role="alert" hidden></p>
<div class="pronunciation-columns" aria-hidden="true"><span>Mot</span><span>Català central · Alba</span><span>Valencià · Enric</span></div>
<div class="pronunciation-scroll"><div id="pronunciation-list" tabindex="-1" aria-label="Taula de pronunciacions"></div><button type="button" id="more-pronunciations" class="button secondary" hidden>Mostra més mots</button></div>
<footer class="review-footer"><span>Les notes es desen en aquest navegador.</span><div><button id="export-reviews" aria-label="Exporta la revisió" title="Exporta la revisió en JSON" class="button primary" type="button"><span data-icon="download"></span> Exporta</button><button type="button" id="import-reviews-open" aria-label="Importa una revisió" title="Importa una revisió en JSON" class="button secondary">Importa</button><input id="import-reviews" type="file" accept=".json,application/json" hidden><button id="export-pronunciations" class="small-link" type="button">Descarrega les IPA</button><button id="report-errors" class="small-link" type="button">Notifica errors <span data-icon="arrow-up-right"></span></button></div><span id="review-save-status" role="status" aria-live="polite"></span></footer>
</section>
