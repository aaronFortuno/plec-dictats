<section class="text-config" aria-labelledby="text-title">
  <div class="text-sidebar-heading"><span id="text-focus-label">Focus de pràctica</span><button type="button" class="small-link" id="text-focus-all">Tots</button></div>
  <div id="text-sidebar-focuses" class="text-sidebar-focuses" role="group" aria-labelledby="text-focus-label"></div>
  <p id="text-sidebar-count" class="sr-only" role="status" aria-live="polite"></p>
  <div id="text-sidebar-results" class="text-sidebar-results" aria-label="Dictats disponibles"></div>
  <div class="text-selected-summary"><p class="text-selected-label">Text del dictat</p><h2 id="text-title">Una exposició al col·legi</h2><p id="text-selected-meta"></p><div id="text-selected-focuses" class="text-selected-focus" aria-label="Focus del dictat seleccionat"></div></div>
  <button type="button" class="small-link" id="text-picker-open" aria-haspopup="dialog" aria-controls="text-picker-dialog"><span data-icon="book-open"></span> Llegeix el text complet</button>
  <label for="text-fold">Plec en dues parts<select id="text-fold"><option value="vertical">Vertical · esquerra i dreta</option><option value="horizontal">Horitzontal · dalt i baix</option></select></label>
  <label for="text-side">Posició del model<select id="text-side"><option value="start">Primera meitat</option><option value="end">Segona meitat</option></select></label>
  <div class="text-layout-controls"><label for="text-font-size">Mida del model (pt)<input id="text-font-size" type="number" inputmode="numeric" min="12" max="16" step="1" value="14" required></label><label for="text-line-spacing">Interlineat de la pauta (mm)<input id="text-line-spacing" type="number" inputmode="numeric" min="8" max="12" step="1" value="10" required></label></div>
  <p id="text-layout-hint"></p><p id="text-layout-error" class="text-layout-error" role="status" aria-live="polite" hidden></p>
</section>
