<dialog id="rhythm-table-dialog" data-pause="1" aria-labelledby="rhythm-table-title">
  <div class="dialog-head"><div><h2 id="rhythm-table-title">Codis de ritme</h2></div><button type="button" class="icon-button" data-close aria-label="Tanca la taula de codis"><span data-icon="x"></span></button></div>
  <div class="rhythm-table-scroll" tabindex="0" role="region" aria-label="Taula de codis de ritme">
    <p class="rhythm-table-intro">Cada codi recorda els mots per fragment, la velocitat i la pausa. Funciona en qualsevol dispositiu i no indica cap nivell ni nota.</p>
    <nav class="rhythm-pause-tabs" aria-label="Pausa entre escoltes"><button type="button" data-rhythm-pause="0.8" aria-pressed="false">Breu</button><button type="button" data-rhythm-pause="1" aria-pressed="true">Habitual</button><button type="button" data-rhythm-pause="1.25" aria-pressed="false">Llarga</button></nav>
    <div id="rhythm-table-content"></div>
  </div>
  <p class="rhythm-table-footer">Introdueix el codi abans de començar. Si ajustes el ritme, al final rebràs el codi corresponent.</p>
</dialog>
