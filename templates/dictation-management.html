<aside class="management card" aria-label="Gestió del full i del dictat oral">
  <div class="management-scroll">
    <div class="text-management">
      <section aria-labelledby="text-sheet-heading"><h2 id="text-sheet-heading">El teu full</h2><div class="text-id-row"><output>LL01</output><button type="button" class="icon-button" id="text-share" aria-label="Copia l’enllaç del full al preparador" title="Copia l’enllaç del full al preparador"><span data-icon="share-2"></span></button></div><button type="button" class="button primary" id="text-download" disabled><span data-icon="download"></span> Descarrega el PDF</button></section>
      <section aria-labelledby="text-oral-heading"><h2 id="text-oral-heading">Dictat oral</h2>
        <label for="text-pace">Mots aproximats per fragment<select id="text-pace"><option value="2">2–3 mots</option><option value="4">4–5 mots</option><option value="6">6–8 mots</option><option value="10">9–12 mots</option></select></label>
        <label for="text-rate">Velocitat<select id="text-rate"><option value="1">Habitual</option><option value="0.9">Més a poc · 90 %</option><option value="0.8">Molt a poc · 80 %</option></select></label>
        <p id="text-fragment-summary"></p><p id="text-audio-note"></p>
        <button type="button" class="button secondary" id="text-open-student"><span data-icon="headphones"></span><span id="text-open-label">Previsualitza el dictat</span></button><button type="button" class="small-link" id="text-share-student">Copia l’enllaç per a l’alumnat</button>
      </section><p id="text-status" role="status" aria-live="polite"></p>
    </div>
    <section class="seed-toolbar" aria-labelledby="seed-management-heading">
      <h2 id="seed-management-heading">El teu full</h2>
      <div class="seed-identity">
        <span class="seed-label">Codi del dictat · <span id="seed-language">CA</span></span>
        <div class="seed-code-row">
          <output id="seed-code" aria-live="polite">—</output>
          <button class="icon-button code-action" id="copy-code" aria-label="Copia el codi del dictat" title="Copia el codi"><span data-icon="copy"></span></button>
          <button class="icon-button code-action" id="copy-link" aria-label="Copia l’enllaç del full al preparador" title="Copia l’enllaç del full al preparador"><span data-icon="share-2"></span></button>
        </div>
      </div>
      <button class="button primary" id="download-pdf"><span data-icon="download"></span> Descarrega el PDF</button>
      <button class="button secondary" id="new-dictation"><span data-icon="refresh-cw"></span> Nou dictat</button>
      <form id="recover-form" class="recover-form"><label for="recover-code">Recupera un dictat</label><div><input id="recover-code" type="text" inputmode="text" placeholder="ABCD-23456" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="button secondary" type="submit">Recupera</button></div></form>
    </section>
    <section class="oral-management" aria-labelledby="oral-management-heading">
      <h2 id="oral-management-heading">Dictat oral</h2>
      <div class="pronunciation-setting"><label for="pronunciation-variety">Pronunciació</label><select id="pronunciation-variety"><option value="central">Català central</option><option value="valencia">Valencià</option></select></div>
      <button class="button secondary" id="open-student"><span data-icon="headphones"></span> Comença el dictat</button>
      <button class="small-link" id="copy-student-link" title="Copia l’enllaç que obre aquest dictat per escoltar-lo">Copia l’enllaç per a l’alumnat</button>
    </section>
  </div>
</aside>
