<dialog id="pronunciation-report" aria-labelledby="pronunciation-report-title">
<form id="pronunciation-report-form"><div class="dialog-head"><h2 id="pronunciation-report-title">Notifica un error</h2><button type="button" class="icon-button" data-close aria-label="Tanca"><span data-icon="x"></span></button></div>
<p id="pronunciation-report-word"></p>
<label for="pronunciation-report-kind">On és l’error?</label><select id="pronunciation-report-kind"><option value="audio">A l’àudio</option><option value="ipa">A la transcripció IPA</option></select>
<label for="pronunciation-report-note">Què cal revisar?</label><textarea id="pronunciation-report-note" maxlength="1000" rows="3" placeholder="Per exemple: la tònica sona desplaçada." required></textarea>
<p class="report-hint">Pots desar la incidència aquí o obrir-la a GitHub per enviar-la al projecte amb el teu compte.</p>
<div class="report-actions"><button class="button primary" type="submit" value="save">Desa</button><button class="button secondary" type="submit" value="github">Obre a GitHub <span data-icon="arrow-up-right"></span></button><button id="pronunciation-report-clear" class="small-link" type="button" hidden>Retira la incidència</button></div></form></dialog>
