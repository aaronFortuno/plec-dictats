name: Local quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chrome in the disposable runner
        run: npx playwright install --with-deps chrome
      - name: Check local workspace, including browser and compatibility
        run: node tools/check-all.cjs --browser --start-server --compatibility
